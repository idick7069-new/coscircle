include /etc/nginx/coscircle-extra/*.conf;

server {
  listen 80 default_server;
  __TLS_LISTEN__
  server_name __WEB_SERVER_NAME__;
  __TLS_CONFIG__

  root /var/www/coscircle/current;
  index index.html;

  client_max_body_size 10m;

  location ^~ /.well-known/acme-challenge/ {
    root /var/lib/coscircle/acme;
    default_type text/plain;
    try_files $uri =404;
  }

  # BEGIN PUBLIC LEGAL PAGES
  # Never return the landing-page fallback for these Play review resources.
  location = /child-safety.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }
  location = /privacy.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }
  location = /terms.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }
  location = /delete-account.html {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }
  location = /delete-account.js {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }
  location = /legal.css {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }
  # END PUBLIC LEGAL PAGES

  location /api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-store";
    return 404;
  }

  location = /flutter_bootstrap.js {
    add_header Cache-Control "no-store";
    return 404;
  }

  location = /main.dart.js {
    add_header Cache-Control "no-store";
    return 404;
  }

  location ~* ^/(app|admin)/(flutter_service_worker\.js|flutter_bootstrap\.js|main\.dart\.js)$ {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /app {
    return 301 /app/;
  }

  location = /admin {
    return 301 /admin/;
  }

  location /app/ {
    try_files $uri $uri/ /app/index.html;
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
}

server {
  listen 80;
  server_name __ADMIN_SERVER_NAME__;

  root /var/www/coscircle/current/admin-root;
  index index.html;

  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
  }

  location ~* ^/(flutter_service_worker\.js|flutter_bootstrap\.js|main\.dart\.js)$ {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
}
